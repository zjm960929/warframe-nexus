name: Vercel Temporary API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy temporary Vercel project
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --temporary --yes 2>&1 | tee /tmp/vercel.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/vercel.log | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "Vercel did not print a deployment URL"
            exit 1
          fi
          echo "### Vercel temporary deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" > vercel-url.txt
      - name: Upload deployment URL
        uses: actions/upload-artifact@v4
        with:
          name: vercel-url
          path: vercel-url.txt
