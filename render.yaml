services:
  - type: web
    name: warframe-nexus-zjm
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: '22'
